<!doctype html><html lang="es-PR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Licencias"><meta name="theme-color" content="#0d9488"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMSOrders · Licencias</title><style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#eefbf8;color:#0f2e2b}main{max-width:900px;margin:auto;padding:16px}
h1{color:#134e4a}input,select{min-height:44px;border:2px solid #99f6e4;border-radius:10px;padding:0 10px;font-size:16px}
button{min-height:44px;border:0;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer;margin:2px}
.ok{background:#0d9488;color:#fff}.no{background:#ffe4e6;color:#9f1239}.gr{background:#e5e7eb}
.t{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}.t h3{margin:0}
.pill{border-radius:99px;padding:2px 10px;font-weight:700;font-size:14px}.pendiente{background:#fef3c7;color:#92400e}.aprobada{background:#ccfbf1;color:#134e4a}
.rechazada,.desactivada{background:#ffe4e6;color:#9f1239}.m{color:#5b6b69;font-size:14px}.f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
</style></head><body><main><h1>RMSOrders · Licencias</h1>
<div id="login"><input id="pw" type="password" placeholder="Tu clave de administración"> <button class="ok" onclick="go()">Entrar</button></div>
<p id="err" class="no" hidden></p><div id="list"></div>
<script>
let pw = sessionStorage.getItem('pw') || ''
const base = "https://vjhlmonruyonnpwmxyyu.supabase.co/functions/v1/quick-responder"
const call = (p, body) => fetch(base + p, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin': pw }, body: JSON.stringify(body || {}) }).then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error); return d })
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';')
const d = (s) => s ? new Date(s).toLocaleString('es-PR', { timeZone: 'America/Puerto_Rico' }) : '—'
function plus(m) { const x = new Date(); x.setMonth(x.getMonth() + m); return x.toISOString().slice(0, 10) }
async function go() { pw = pw || document.getElementById('pw').value; try { const l = await call('/admin/lista'); sessionStorage.setItem('pw', pw); document.getElementById('login').hidden = true; show(l) } catch (e) { pw = ''; err(e.message) } }
function err(m) { const e = document.getElementById('err'); e.textContent = m; e.hidden = false }
function show(l) {
  document.getElementById('list').innerHTML = l.length ? l.map((r) => '<div class="t"><h3>' + e(r.tienda) + ' <span class="pill ' + e(r.estado) + '">' + e(r.estado) + '</span></h3>'
    + '<div class="m">' + [r.contacto, r.telefono, r.email, r.pueblo].filter(Boolean).map(e).join(' · ') + '<br>Base ' + e(r.base) + ' en ' + e(r.servidor) + ' · versión ' + e(r.version) + ' · pidió ' + d(r.creada) + ' · última revisión ' + d(r.ultima_revision) + (r.vence ? ' · <b>vence ' + r.vence + '</b>' : '') + (r.notas ? '<br>Nota: ' + e(r.notas) : '') + '</div>'
    + '<div class="f">Vence: <select id="v' + r.id + '"><option value="' + plus(3) + '">3 meses (prueba)</option><option value="' + plus(1) + '">1 mes</option><option value="' + plus(12) + '">1 año</option><option value="">Sin vencimiento</option></select>'
    + '<input id="n' + r.id + '" placeholder="Nota (opcional)">'
    + '<button class="ok" onclick="act(\'' + r.id + '\',\'aprobar\')">Aprobar</button><button class="no" onclick="act(\'' + r.id + '\',\'rechazar\')">Rechazar</button><button class="gr" onclick="act(\'' + r.id + '\',\'desactivar\')">Desactivar</button></div></div>').join('')
    : '<p>No hay solicitudes todavía.</p>'
}
async function act(id, accion) { try { await call('/admin/accion', { id, accion, vence: document.getElementById('v' + id).value, notas: document.getElementById('n' + id).value }); show(await call('/admin/lista')) } catch (e) { err(e.message) } }
if (pw) go()
</script></main></body></html>
